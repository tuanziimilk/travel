services:

  # ──────────────────────────────
  # MySQL 8
  # ──────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 400m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quality_scoring}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    # ports 不对外暴露，只允许同一 compose 网络内的容器访问
    # - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ──────────────────────────────
  # 数据库迁移（一次性，完成后退出）
  # ──────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    mem_limit: 512m         # 构建产物中含 drizzle-kit，临时使用后退出
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # ──────────────────────────────
  # API（Express + tRPC）
  # ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    mem_limit: 320m
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: ${API_PORT:-3001}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_COST_AUTO_MATCH: ${AI_COST_AUTO_MATCH:-true}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1200}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-about_quality_scoring_v1}
      AI_INPUT_COST_PER_1M: ${AI_INPUT_COST_PER_1M:-0.40}
      AI_OUTPUT_COST_PER_1M: ${AI_OUTPUT_COST_PER_1M:-1.60}
      ABOUT_SKILL_PATH: ${ABOUT_SKILL_PATH:-skills/about-quality-scoring}
      FAQ_SKILL_PATH: ${FAQ_SKILL_PATH:-skills/faq-quality-scoring}
      SNAPSHOT_ENABLED: ${SNAPSHOT_ENABLED:-true}
      INGEST_ROW_CONCURRENCY: ${INGEST_ROW_CONCURRENCY:-14}
      INGEST_ADAPTIVE_THROTTLE_ENABLED: ${INGEST_ADAPTIVE_THROTTLE_ENABLED:-true}
      INGEST_FAILURE_STREAK_THRESHOLD: ${INGEST_FAILURE_STREAK_THRESHOLD:-3}
      INGEST_THROTTLE_MS: ${INGEST_THROTTLE_MS:-1200}
      INGEST_ROW_MAX_RETRIES: ${INGEST_ROW_MAX_RETRIES:-1}
      INGEST_FINAL_RETRY_PASSES: ${INGEST_FINAL_RETRY_PASSES:-1}
      INGEST_FINAL_RETRY_CONCURRENCY: ${INGEST_FINAL_RETRY_CONCURRENCY:-6}
      INGEST_PROGRESS_FLUSH_MS: ${INGEST_PROGRESS_FLUSH_MS:-1000}
      INGEST_JOB_STALL_MS: ${INGEST_JOB_STALL_MS:-1200000}
      AI_HTTP_MAX_RETRIES: ${AI_HTTP_MAX_RETRIES:-1}
      AI_EXECUTOR_MAX_RETRIES: ${AI_EXECUTOR_MAX_RETRIES:-1}
      AI_REQUEST_TIMEOUT_MS_BATCH: ${AI_REQUEST_TIMEOUT_MS_BATCH:-90000}
    volumes:
      # skills 目录持久化挂载，支持在线编辑后重启生效
      - ./skills:/app/skills
      - ./apps/api/.runtime:/app/apps/api/.runtime
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3001:3001"           # 如通过 nginx 统一暴露可删除此行

  # web 静态文件由宿主机 nginx 托管（见 nginx/host-nginx.conf）

volumes:
  mysql_data:
